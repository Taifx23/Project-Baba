name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar SDL2
        run: git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git

      - name: Generar el proyecto Android con tu codigo
        run: |
          cd SDL
          ./build-scripts/androidbuild.sh com.taifx.baba "$GITHUB_WORKSPACE/src/main.cpp"
          cd build/com.taifx.baba
          NDK_VER=$(basename "$ANDROID_NDK_HOME")
          sed -i "s|compileSdkVersion 34|compileSdkVersion 34\n    ndkVersion \"$NDK_VER\"|" app/build.gradle
          sed -i "s|minSdkVersion 19|minSdkVersion 21|; s|android-19|android-21|; s|abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'|abiFilters 'arm64-v8a'|" app/build.gradle
          sed -i "s|^APP_ABI.*|APP_ABI := arm64-v8a|; s|android-16|android-21|" app/jni/Application.mk

      - name: Compilar
        working-directory: SDL/build/com.taifx.baba
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectBaba-apk
          path: SDL/build/com.taifx.baba/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK para descargarlo desde el movil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SDL/build/com.taifx.baba/app/build/outputs/apk/debug/app-debug.apk ProjectBaba.apk
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest ProjectBaba.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ultima compilacion" --notes "APK de prueba (debug)" --prerelease